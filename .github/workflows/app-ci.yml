name: APP CI

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/rag_api/**'
      - 'apps/ui/**'
      - 'infra/app/**'
      - 'requirements.txt'
      - '.github/workflows/app-ci.yml'

  push:
    branches: [dev, 'infra/app-*']
    paths:
      - 'apps/rag_api/**'
      - 'apps/ui/**'
      - 'infra/app/**'
      - 'requirements.txt'
      - '.github/workflows/app-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Build API image
        run: |
          docker build \
            -f infra/app/Dockerfile \
            -t rag-api:ci .

      - name: Validate Compose and image
        run: bash infra/app/verify-image.sh rag-api:ci

      - name: Verify pull deployment safety
        run: python3 -m unittest discover -s infra/app/tests -v

      - name: Rehearse with disposable PostgreSQL and RAG containers
        run: bash infra/app/tests/rehearse-deploy.sh
