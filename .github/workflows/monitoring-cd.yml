name: MON01 모니터링 배포

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mon01-monitoring-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: 배포 전 설정 검증
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v5

      - name: 배포 파일 검증
        run: |
          set -euo pipefail
          test -f infra/monitoring/inventory.json
          test -f infra/monitoring/compose.yml
          test -f infra/monitoring/deploy.sh
          bash -n infra/monitoring/deploy.sh
          python3 -m py_compile infra/monitoring/render.py
          docker compose -f infra/monitoring/compose.yml config --quiet

      - name: 최초 배포 대상 확인
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          inventory = json.loads(
              Path("infra/monitoring/inventory.json").read_text()
          )
          enabled = {
              entry["check"]
              for entry in inventory["checks"]
              if entry["target"] is not None
          }
          expected = {
              "prometheus", "blackbox",
              "alertmanager", "grafana"
          }
          assert enabled == expected, (
              f"Unexpected targets: {sorted(enabled)}"
          )
          print("중앙 서비스 4개만 활성화됨")
          PY

  deploy:
    name: MON01 실제 배포
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, mon01-cd]
    timeout-minutes: 20

    steps:
      - name: 승인된 코드 가져오기
        uses: actions/checkout@v5

      - name: MON01 배포 환경 확인
        run: |
          set -euo pipefail
          test "$(id -un)" = "team01"
          command -v rsync
          command -v python3
          docker info >/dev/null
          test -s /opt/infra-monitoring/secrets/grafana-admin

          if test -e /opt/infra-monitoring/site.json; then
            echo "최초 배포에서는 site.json이 없어야 합니다."
            exit 1
          fi

      - name: 배포 파일 동기화
        run: |
          set -euo pipefail
          rsync -a \
            --exclude='/secrets/' \
            --exclude='/runtime/' \
            --exclude='/site.json' \
            --exclude='/.env' \
            "$GITHUB_WORKSPACE/infra/monitoring/" \
            /opt/infra-monitoring/

      - name: Docker Compose 배포
        working-directory: /opt/infra-monitoring
        run: |
          set -euo pipefail
          bash ./deploy.sh

      - name: 컨테이너 상태 확인
        working-directory: /opt/infra-monitoring
        run: |
          docker compose ps

      - name: 중앙 서비스 헬스 체크
        run: |
          set -euo pipefail
          for endpoint in \
            http://127.0.0.1:9090/-/healthy \
            http://127.0.0.1:3000/api/health \
            http://127.0.0.1:9115/metrics \
            http://127.0.0.1:9093/-/healthy
          do
            healthy=false
            for attempt in $(seq 1 15); do
              if curl -fsS --max-time 3 \
                   -o /dev/null "$endpoint"; then
                healthy=true
                break
              fi
              sleep 2
            done
            if [[ "$healthy" != true ]]; then
              echo "헬스 체크 실패: $endpoint"
              exit 1
            fi
            echo "정상: $endpoint"
          done
