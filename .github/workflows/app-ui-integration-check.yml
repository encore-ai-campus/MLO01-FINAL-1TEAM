# Temporary verification for PR #30; removed after collecting runner results.
name: APP UI integration verification
on:
  pull_request:
    branches: [dev]
    paths:
      - 'infra/app/**'
      - '.github/workflows/app-ui-integration-check.yml'
permissions:
  contents: read
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Combine latest dev and UI PR locally
        run: |
          git config user.name 'APP integration verification'
          git config user.email 'app-ci@example.invalid'
          git fetch origin dev:refs/remotes/origin/dev pull/26/head:refs/remotes/origin/pr26
          git merge --no-edit origin/dev
          git merge --no-edit origin/pr26
          git log -3 --format='%H %s'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install integrated dependencies
        run: pip install -r requirements.txt
      - name: Build integrated image
        run: docker build -f infra/app/Dockerfile -t rag-api:ui-integration .
      - name: Verify integrated API import
        run: docker run --rm --network none rag-api:ui-integration python -c "from rag_api.main import app; print(app.title)"
      - name: Verify integrated UI files and templates
        run: python infra/app/verify_ui_image.py rag-api:ui-integration
      - name: Run integrated unit and security tests
        run: pytest -q
