name: MON01 Runner 연결 테스트

on:
  push:
    branches:
      - infra/unified-monitoring
    paths:
      - .github/workflows/runner-check.yml

permissions: {}

jobs:
  runner-check:
    name: MON01 실행 확인
    runs-on: [self-hosted, Linux, X64, mon01-cd]
    timeout-minutes: 3

    steps:
      - name: Runner 환경 확인
        run: |
          echo "Runner: $RUNNER_NAME"
          whoami
          hostname
          uname -s
