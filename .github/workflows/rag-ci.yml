name: RAG CI

on:
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  unit-test:
    name: RAG 단위 시험
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v5

      - name: Python 3.14 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 단위 시험
        run: pytest -q tests/unit
