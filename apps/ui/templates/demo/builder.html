<section class="screen" data-screen="builder" hidden>
      <header class="screen-head"><h1 class="frame-heading" tabindex="-1">사규 초안</h1><p>표준 양식으로 초안을 만들고 문서 검수에 제출하세요.</p></header>
      <div class="screen-body split">
        <div class="card"><h2>표준 양식</h2>
          <form class="form" id="builder-form">
            <label>양식 선택 <select id="builder-template"><option value="expense">출장비 규정</option><option value="leave">휴가 운영 규정</option><option value="approval">위임전결 규정</option></select></label>
            <label>문서 제목 <input id="builder-title" required maxlength="70"></label>
            <label>핵심 기준 <input id="builder-rule" required maxlength="120"></label>
            <label>시행일 <input id="builder-date" type="date" value="2026-12-28" required></label>
            <div class="row"><button class="btn btn-wide" type="submit">초안 생성</button></div>
          </form>
          <details><summary>외부 참고 사례</summary><div id="builder-benchmark" class="source-stack"></div></details>
        </div>
        <div class="card"><div class="row row-between"><h2>사규 초안</h2><span id="builder-status" class="badge warn">작성 중</span></div>
          <p id="builder-note" class="small">초안을 만든 뒤 문구를 편집하고 검수에 제출할 수 있습니다.</p>
          <label class="form"><span class="field-label">초안 본문</span><textarea id="draft-body" rows="6" placeholder="생성된 초안이 여기에 표시됩니다."></textarea></label>
          <div class="row" id="draft-actions"><button id="draft-submit" class="btn btn-primary" type="button">검수에 제출</button><button id="draft-review" class="btn" type="button" hidden>문서 검수로 이동</button><button id="draft-new" class="btn" type="button" hidden>새 초안</button></div>
          <p id="builder-notice" class="notice" aria-live="polite"></p>
        </div>
      </div>
    </section>
