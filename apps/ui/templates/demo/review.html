<section class="screen" data-screen="review" hidden>
      <div id="review-overview">
        <header class="screen-head"><h1 class="frame-heading" tabindex="-1">문서 검수</h1><p>자동 분류 문서와 제출된 사규 초안을 한곳에서 검토합니다.</p></header>
        <div class="screen-body split">
          <div class="card">
            <div class="row row-between"><h2>검수 대기 문서</h2><span class="small" id="review-count"></span></div>
            <div class="row"><button class="btn btn-primary" id="review-create-draft" type="button">초안 작성</button></div>
            <div class="item-list" id="review-list"></div>
            <div class="stack" id="review-rejected" hidden><h3>반려된 초안</h3><div class="item-list"></div></div>
          </div>
          <div class="card" id="review-detail"></div>
        </div>
      </div>
      <div id="review-builder" hidden>
        {% include "demo/builder.html" %}
      </div>
    </section>
