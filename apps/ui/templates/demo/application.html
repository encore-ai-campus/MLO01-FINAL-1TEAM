<section class="screen" data-screen="application" hidden>
      <header class="screen-head"><h1 class="frame-heading" tabindex="-1">가입 신청·상태</h1><p>부서 권한을 신청하거나 처리 상태를 확인하세요.</p></header>
      <div class="screen-body split">
        <div class="card">
          <div class="modebar segmented-control" role="group" aria-label="가입 메뉴">
            <button type="button" data-application-mode="signup" aria-pressed="true">가입 신청</button>
            <button type="button" data-application-mode="status" aria-pressed="false">신청 상태</button>
          </div>
          <form class="form" id="signup-form" data-application-panel="signup">
            <label>이름 <input name="displayName" required maxlength="40" autocomplete="off"></label>
            <label>사내 이메일 <input name="email" type="email" readonly></label>
            <label>사번 (선택) <input name="employeeId" maxlength="24" autocomplete="off"></label>
            <label>희망 부서 <select name="department" required><option>경영운영팀</option><option>재무팀</option><option>개발팀</option></select></label>
            <div class="row"><button class="btn btn-primary btn-wide" type="submit">가입 신청</button></div>
          </form>
          <div data-application-panel="status" id="application-status" class="stack" hidden></div>
          <p id="application-notice" class="notice" aria-live="polite"></p>
        </div>
        <aside class="card soft"><h2>가입 후 이용 절차</h2><p>관리자가 신청 내용을 확인하고 열람 부서를 배정합니다. 보완 요청을 받으면 기존 신청 내용을 수정해 다시 제출할 수 있어요.</p></aside>
      </div>
    </section>
