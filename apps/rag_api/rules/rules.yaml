# 메인기획 고정 문구·판별 패턴(rules.md). 값이 바뀌면 이 파일만 바꿈. 판정은 쓰는 모듈의 코드가 함.
# 숫자·스위치 값(근거 부족 기준값 등)은 여기가 아니라 환경 변수(shared/config.py).
# 키를 더하면 rules/values.py 의 Rules 에도 필드를 더함. 빠진 키·모양이 틀린 값·정규식 오류는 앱이 시작하지 않음.
# 정규식은 작은따옴표로 씀(역슬래시를 그대로 둠). 패턴 목록은 하나라도 맞으면 맞음.

# 협조전 안내(약속서 00 4.2·03A 4절 예시와 같은 문장). {dept_name} 은 소관 부서 표시 이름
cooperation_request: "본 문서는 {dept_name} 열람 제한 규정입니다. 열람이 필요한 경우 사내 그룹웨어에서 {dept_name} 앞으로 '문서 열람 협조전'을 신청해 주시기 바랍니다."

# 근거 부족(R3) 문구(약속서 03B 3.4). 볼 수 있는 문서가 없어서 근거가 없을 때도 같음
insufficient_message: "질문하신 내용과 일치하는 사내 규정 근거를 찾지 못했습니다."

# 개인·실시간 조회(본인 지칭·특정인·실시간 시점). 근거 부족 응답의 그룹웨어 안내에만 씀(근거 부족 판정에는 안 씀).
# 초기값은 2026-11-20 에 잰 근거 부족 판정 실측(IDF 덮음·벡터 코사인, 개인·실시간 조회 패턴 5.1) 그대로. "내·제"는 문장 맨 앞만("직장 내 괴롭힘"을 잡지 않게)
personal_lookup_patterns:
  - '^(내|제)\s|(나의|저의)\s'
  - '우리\s?팀\s?(팀장|팀원|동료)|[A-Za-z가-힣]씨(의|가|는)?\s'
  - '오늘|어제|이번\s?(달|주)|올해 남은|진행\s?(상태|중인)|실시간'

# 특정 건의 처리·진행 현황 조회(예: 지난주 신청한 출장비 정산 건 처리 상태). 규정 문서에 답이 없으므로 찾지 않고
# LLM 도 부르지 않고 근거 부족 응답 + 그룹웨어 안내(백엔드 결정, 7차 회신 2.2절 후속).
# 접수·신청한 그 건이나 "… 건 … 처리 상태" 로 문장이 끝나거나, 그 뒤에 현황 자체를 묻는 말(어떻게 돼·알려 줘·확인해 줘·좀·
# 궁금…)만 붙어 문장이 끝날 때만. 뒤에 말이 더 붙으면(처리 상태 확인 절차는?·알려야 하는 기한·어떻게 조회하나요?) 규정·방법을
# 묻는 질문이라 잡지 않음
case_status_patterns:
  - '(접수된|신청한|요청한|올린|넣은|\s건(의|은|는|이|가)?)\s.{0,30}(처리|진행)\s?(상태|현황|상황)(가|는|은|이|를|을)?\s*(어떻게\s*(되|돼|됐)\S*|어때\S*|어디까지\s*\S*|알려\s*(줘|주세요|주십시오|줄래|주실)\S*|확인\s*(해\s*줘|해\s*주세요|부탁)\S*|좀|궁금\S*)?\s*[?？.!]?\s*$'

# 개인 수치(5-12, 예: 내 남은 연차). 답변에 personal_data_guide 안내를 붙임(qa 2단계)
personal_numeric_patterns:
  - '(남은|잔여).{0,10}(연차|휴가)'

# 절차 질문 → graph_hybrid(앞뒤 단계 문서를 함께 찾음). Golden QA v2 step_graph 6문항으로 정함
procedure_patterns:
  - '어떤 순서|순서대로|다음 단계|먼저 해야|사전 합의|앞뒤'

# 개인·실시간 조회로 판별된 근거 부족 응답에 붙이는 그룹웨어 안내(kind personal_data_guide). 처음 맞는 것.
# 연차는 5-12 문구, 그 밖은 골든셋 기대 답을 따른 제안 문구. [대기: 서브기획 확인] 화면 작업 때
groupware_guides:
  - pattern: '(남은|잔여).{0,10}(연차|휴가)'
    text: "개인별 잔여 연차 일수는 사내 그룹웨어 근태/휴가 메뉴에서 확인해 주세요."
  - pattern: '연차|휴가|근태'
    text: "개인별 근태·휴가 일정은 조회할 수 없습니다. 사내 그룹웨어 근태/휴가 메뉴에서 확인해 주세요."
  - pattern: '법인카드|전표'
    text: "개인별 법인카드 사용 내역과 미정산 전표는 조회할 수 없습니다. 사내 그룹웨어 법인카드 정산 메뉴에서 확인해 주세요."
  - pattern: '연말정산|세액|환급액'
    text: "개인별 세액공제 자료가 없어 연말정산 환급액을 계산할 수 없습니다."
  - pattern: '티켓|환불 건|접수된'
    text: "고객 문의(CS) 건의 실시간 처리 상태는 조회할 수 없습니다."

groupware_guide_default: "개인별·실시간 정보는 사내 규정 문서에 없어 조회할 수 없습니다. 사내 그룹웨어의 해당 메뉴에서 확인해 주세요."

# --- AI 답변 조립(qa 2단계, 약속서 03B 3.1·3.3, qa.md §3). 자리표시자는 시작 때 한 번 채워 봄 ---

# 근거 후보에 2순위(표준 양식)가 있을 때 LLM 지시에 더함(R1, 7차 회신 1절 4절 2 문구). 근거는 [주 근거 — 사내 공식 사규]·
# [보조 근거 — 공공 표준 양식 (사내 규정 아님)] 구역으로 나눠 넘김(구역 표시는 코드 qa/service.py). 화면에 나오지 않음
evidence_priority_instruction: "[주 근거]에 질문에 답할 기준·수치가 있으면 반드시 [주 근거]만으로 답하고 [보조 근거] 수치로 덮어쓰지 말 것. [주 근거]에 해당 기준이 없을 때만 [보조 근거]를 인용해 답하되 사내 공식 규정이 아님을 명시할 것."

# 인용에 1순위(공식 사규)가 없을 때의 머리말(R1, 7차 회신 1절 4절 3, 9차 회신 확정 문구). {title} 은 인용 첫 문서 제목.
# 인용 첫 문서가 외부 참고 사례(benchmark_reference)면 benchmark_reference_header, 아니면 standard_template_header
standard_template_header: "현재 본 질문에 직접 해당하는 사내 공식 조항이 없어, 공공 표준 양식([{title}])을 기준으로 안내합니다."
benchmark_reference_header: "현재 본 질문에 직접 해당하는 사내 공식 조항이 없어, 외부 참고 사례([{title}])를 기준으로 안내합니다."

# 인용 문서의 시행일이 오늘(한국 날짜)보다 뒤일 때(5-08). 문서마다. {effective_from} 은 YYYY-MM-DD
scheduled_revision_notice: "[안내] 본 규정은 {effective_from} 시행 예정인 개정판 기준입니다."

# 인용에 아래 부서 소관 문서가 있으면 답변 아래 하나(5-11)
legal_disclaimer: "※ 본 답변은 사내 규정 원문에 기반한 안내이며 최종 법적·노무적 유권해석은 인사/법무 담당 부서의 확인이 필요합니다."
legal_disclaimer_depts: [HR, LGL]

# 전사·부서 충돌(R2) 병기 지시. 충돌 쌍의 두 문서가 모두 근거에 있을 때 LLM 지시에 더함.
# {a}·{b} 는 두 문서 제목(전사 공통 쪽이 a), {priority_rule} 은 그래프 메타 conflicts 의 우선 적용 규칙
# 문구는 백엔드 초안(qa.md §3 R2 "두 기준을 병기하고 부서 최신 세칙을 우선"을 LLM 지시로 옮김). 화면에 나오지 않음
conflict_instruction: "근거의 「{a}」와 「{b}」는 같은 사항에 대한 기준이 서로 다릅니다. 두 기준을 모두 밝혀 쓰고, 다음 우선 적용 규칙을 따르세요: {priority_rule}"
