server {
    listen 192.168.0.151:443 ssl;
    server_name upmutok.officemanlab.com;

    ssl_certificate /etc/nginx/ssl/upmutok.crt;
    ssl_certificate_key /etc/nginx/ssl/upmutok.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    location = /api/v1/search/documents {
        proxy_pass http://192.168.0.158:8001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    location / {
        return 404;
    }
}
