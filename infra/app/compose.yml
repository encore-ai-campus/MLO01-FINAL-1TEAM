services:
  rag-api:
    image: ${RAG_IMAGE:?RAG_IMAGE required}
    container_name: rag-api
    restart: unless-stopped

    ports:
      - "127.0.0.1:8000:8000"

    env_file:
      - .env

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    logging:
      options:
        max-size: "10m"
        max-file: "3"
